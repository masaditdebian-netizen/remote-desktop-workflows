name: RICH LINUX (GNOME + Chrome Remote Desktop)

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "Paste SELURUH command Chrome Remote Desktop dari halaman Set up Remote Access"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # SYSTEM UPDATE
      # ============================================================
      - name: Prepare System
        run: |
          sudo apt-get update

          sudo apt-get remove -y --purge \
            man-db \
            firewalld \
            ufw \
            || true

          sudo apt-get autoremove -y || true

          echo "System prepared."


      # ============================================================
      # GNOME
      # ============================================================
      - name: Install GNOME Desktop
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            gnome-session \
            gnome-shell \
            gnome-terminal \
            nautilus \
            dbus-x11 \
            x11-xserver-utils \
            xorg \
            adwaita-icon-theme \
            fonts-cantarell

          echo "GNOME installed."


      # ============================================================
      # CREATE USER
      # ============================================================
      - name: Setup Remote User
        run: |
          sudo useradd \
            -m \
            -s /bin/bash \
            runner || true

          echo "runner:Antigravity2026!" | sudo chpasswd

          sudo usermod -aG sudo runner

          sudo mkdir -p /home/runner/Desktop

          sudo chown -R runner:runner /home/runner

          echo "Remote user created."


      # ============================================================
      # GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        run: |
          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/google-chrome.deb

          sudo apt-get install -y /tmp/google-chrome.deb

          rm -f /tmp/google-chrome.deb

          google-chrome --version


      # ============================================================
      # VS CODE
      # ============================================================
      - name: Install VS Code
        run: |
          wget -qO- \
            https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/packages.microsoft.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
            | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null

          sudo apt-get update

          sudo apt-get install -y code

          code --version


      # ============================================================
      # CHROME REMOTE DESKTOP
      # ============================================================
      - name: Install Chrome Remote Desktop
        run: |
          echo "Installing Chrome Remote Desktop..."

          wget -qO- \
            https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/google-linux.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome-remote-desktop/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/chrome-remote-desktop.list > /dev/null

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            chrome-remote-desktop

          echo "Chrome Remote Desktop installed."


      # ============================================================
      # CONFIGURE GNOME FOR CRD
      # ============================================================
      - name: Configure Chrome Remote Desktop Session
        run: |
          sudo -u runner bash -c 'cat > /home/runner/.chrome-remote-desktop-session <<EOF
          exec /etc/X11/Xsession "gnome-session"
          EOF'

          sudo chown runner:runner \
            /home/runner/.chrome-remote-desktop-session

          sudo chmod +x \
            /home/runner/.chrome-remote-desktop-session

          echo "GNOME CRD session configured."


      # ============================================================
      # DESKTOP SHORTCUTS
      # ============================================================
      - name: Create Desktop Shortcuts
        run: |
          sudo -u runner bash -c 'cat > /home/runner/Desktop/Antigravity.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Antigravity
          Comment=Open Google Antigravity
          Exec=google-chrome --app=https://antigravity.google/ --no-sandbox
          Icon=google-chrome
          Terminal=false
          EOF'

          sudo -u runner bash -c 'cat > /home/runner/Desktop/VSCode.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Visual Studio Code
          Comment=Visual Studio Code
          Exec=code
          Icon=code
          Terminal=false
          EOF'

          sudo chmod +x /home/runner/Desktop/*.desktop

          sudo chown -R runner:runner /home/runner/Desktop


      # ============================================================
      # REGISTER CHROME REMOTE DESKTOP HOST
      # ============================================================
      - name: Register Chrome Remote Desktop
        env:
          CRD_COMMAND: ${{ inputs.crd_host_command }}
        run: |
          echo "Registering Chrome Remote Desktop..."

          sudo -u runner bash -c "$CRD_COMMAND"

          echo ""
          echo "=============================================="
          echo "   CHROME REMOTE DESKTOP READY"
          echo "=============================================="
          echo ""
          echo "Google Account:"
          echo "Use the Google account that generated the CRD command."
          echo ""
          echo "Remote user:"
          echo "runner"
          echo ""
          echo "Password:"
          echo "Antigravity2026!"
          echo ""
          echo "Open:"
          echo "https://remotedesktop.google.com/access"
          echo ""
          echo "=============================================="


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify Installation
        run: |
          echo "========== SYSTEM =========="
          uname -a

          echo ""
          echo "========== GNOME =========="
          gnome-shell --version || true

          echo ""
          echo "========== CHROME =========="
          google-chrome --version || true

          echo ""
          echo "========== VS CODE =========="
          code --version || true

          echo ""
          echo "========== CRD =========="
          systemctl status chrome-remote-desktop@$USER.service \
            --no-pager \
            || true

          echo ""
          echo "========== USER =========="
          id runner

          echo ""
          echo "Installation verification completed."


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        run: |
          echo "Chrome Remote Desktop is running."
          echo "Workflow will remain active."

          sleep 21600
